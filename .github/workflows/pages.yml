name: Deploy bot logs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src/App/packages.lock.json

      - name: Cache wasm-tools
        id: wasm-tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DOTNET_ROOT }}/sdk-manifests
            ${{ env.DOTNET_ROOT }}/packs
            ${{ env.DOTNET_ROOT }}/metadata
          key: wasm-tools-${{ steps.dotnet.outputs.dotnet-version }}

      - name: Install wasm-tools
        if: steps.wasm-tools.outputs.cache-hit != 'true'
        run: dotnet workload install wasm-tools

      - name: Restore previous build
        uses: actions/cache@v4
        with:
          path: src/App/obj
          key: publish-obj-${{ github.run_id }}
          restore-keys: publish-obj-

      - name: Keep incremental timestamps
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            stamp=$(git log -1 --format=%cI -- "$file")
            if [ -n "$stamp" ]; then
              touch -d "$stamp" -- "$file"
            fi
          done

      - name: Publish
        env:
          LOG_URL: ${{ secrets.LOG_URL }}
        run: |
          rm -rf ~/.nuget/packages/microsoft.net.sdk.webassembly.pack ~/.nuget/packages/microsoft.net.illink.tasks
          sed -i "s|__LOG_URL__|${LOG_URL}|" src/App/LogAccess.cs
          dotnet publish src/App/TkmmKaren.Dashboard.csproj -c Release -o ${{ runner.temp }}/publish

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/publish/wwwroot
