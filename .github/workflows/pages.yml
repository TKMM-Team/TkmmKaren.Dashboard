name: Deploy bot logs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      - name: Publish
        env:
          LOG_URL: ${{ secrets.LOG_URL }}
        run: |
          sed -i "s|__LOG_URL__|${LOG_URL}|" src/App/LogAccess.cs
          dotnet publish src/App/TkmmKaren.Dashboard.csproj -c Release -o ${{ runner.temp }}/publish

      - name: Locate site
        id: site
        run: |
          if [ -f "$RUNNER_TEMP/publish/wwwroot/index.html" ]; then
            echo "path=$RUNNER_TEMP/publish/wwwroot" >> "$GITHUB_OUTPUT"
          else
            echo "path=$RUNNER_TEMP/publish" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.site.outputs.path }}
          cname: botlogs.tkmm.org
