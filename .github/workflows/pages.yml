name: Deploy bot logs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            src/App/packages.lock.json
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'src/App/TkmmKaren.Dashboard.csproj', 'global.json', 'nuget.config') }}

      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      - name: Restore previous build
        uses: actions/cache@v4
        with:
          path: src/App/obj
          key: publish-obj-${{ github.run_id }}
          restore-keys: publish-obj-

      - name: Keep incremental timestamps
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            stamp=$(git log -1 --format=%cI -- "$file")
            if [ -n "$stamp" ]; then
              touch -d "$stamp" -- "$file"
            fi
          done

      - name: Publish
        env:
          LOG_URL: ${{ secrets.LOG_URL }}
        run: |
          sed -i "s|__LOG_URL__|${LOG_URL}|" src/App/LogAccess.cs
          dotnet publish src/App/TkmmKaren.Dashboard.csproj -c Release -o ${{ runner.temp }}/publish

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/publish/wwwroot
